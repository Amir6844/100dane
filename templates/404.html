{% extends 'base.html' %}
{% block title %}۴۰۴ — یافت نشد{% endblock %}

    <div class="absolute top-0 right-0 w-full h-1 bg-daneh-600"></div>
    <div class="w-20 h-20 mx-auto rounded-[1.5rem] bg-daneh-100 grid place-items-center text-3xl">🍎</div>

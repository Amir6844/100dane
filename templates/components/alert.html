<div class="rounded-2xl px-4 py-3 text-sm flex gap-3 border
{% if type == 'success' %}bg-barg-50 text-green-900 border-green-200{% elif type == 'error' %}bg-daneh-50 text-daneh-800 border-daneh-200{% elif type == 'warning' %}bg-amber-50 text-amber-900 border-amber-200{% else %}bg-cream-100 border-zinc-200{% endif %}">
  <span class="text-lg">{% if type == 'success' %}✅{% elif type == 'error' %}⚠️{% elif type == 'warning' %}💡{% else %}ℹ️{% endif %}</span>
  <div class="flex-1">{{ message }}</div>
</div>
